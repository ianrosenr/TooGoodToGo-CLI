name: Dashboard tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_pi_dashboard.py tests/test_monitoring.py tests/test_simulated_events.py tests/test_purchase_limits.py tests/test_simulated_checkout.py
